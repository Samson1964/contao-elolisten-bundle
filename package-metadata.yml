de:
    title: Deutsche FIDE-Elo-Listen
    description: >
        Gibt FIDE-Elo-Listen mit deutschen Spielern als Bestenliste, Top-Liste und Statistik im Frontend aus. Es können beliebig viele Listen angelegt werden und der Import in diese Listen erfolgt mit der jeweiligen XML-Datei von der FIDE. Es werden dabei nur deutsche Spieler importiert.
